# Uso local de desenvolvimento apenas — infra real (VPS/Dokploy) é gerenciada à parte.
services:
  mysql:
    image: mysql:8.4
    container_name: geekstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geekstore
      MYSQL_USER: geekstore
      MYSQL_PASSWORD: geekstore
    ports:
      - '3306:3306'
    volumes:
      - geekstore_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: geekstore-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - geekstore_redis_data:/data

  # Bucket S3-compatível de dev (imagens do catálogo). API em 9100, console em 9101.
  # A imagem oficial minio/minio saiu do Docker Hub; bitnamilegacy/minio é o MinIO com criação de
  # bucket por variável. O bucket nasce com leitura pública (equivale à CDN na frente do bucket).
  minio:
    image: bitnamilegacy/minio:latest
    container_name: geekstore-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: geekstore
      MINIO_ROOT_PASSWORD: geekstore-minio-dev
      MINIO_DEFAULT_BUCKETS: geekstore-media:public
      # O navegador faz PUT direto no bucket (URL pré-assinada) a partir de outra origem.
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - geekstore_minio_data:/bitnami/minio/data

volumes:
  geekstore_mysql_data:
  geekstore_redis_data:
  geekstore_minio_data:
