# Uso local de desenvolvimento apenas — infra real (VPS/Dokploy) é gerenciada à parte.
services:
  # PostgreSQL 18 (última estável; a 19 ainda é beta). Porta 5434: 5432 e 5433 são de outros projetos.
  # Banco com collation ICU pt-BR (ordenação correta de nomes com acento). Desde a 18 a imagem guarda
  # os dados em /var/lib/postgresql/18/docker, por isso o volume monta /var/lib/postgresql.
  postgres:
    image: postgres:18
    container_name: geekstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geekstore
      POSTGRES_PASSWORD: geekstore
      POSTGRES_DB: geekstore
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR'
    ports:
      - '5434:5432'
    volumes:
      - geekstore_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geekstore -d geekstore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geekstore-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - geekstore_redis_data:/data

  # Bucket S3-compatível de dev (imagens do catálogo). API em 9100, console em 9101.
  # A imagem oficial minio/minio saiu do Docker Hub; bitnamilegacy/minio é o MinIO com criação de
  # bucket por variável. O bucket nasce com leitura pública (equivale à CDN na frente do bucket).
  minio:
    image: bitnamilegacy/minio:latest
    container_name: geekstore-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: geekstore
      MINIO_ROOT_PASSWORD: geekstore-minio-dev
      MINIO_DEFAULT_BUCKETS: geekstore-media:public
      # O navegador faz PUT direto no bucket (URL pré-assinada) a partir de outra origem.
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - geekstore_minio_data:/bitnami/minio/data

volumes:
  geekstore_pg_data:
  geekstore_redis_data:
  geekstore_minio_data:
