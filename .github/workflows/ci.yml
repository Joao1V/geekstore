name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # prisma generate (packages/db) só lê o schema, não precisa de um banco real —
  # mas o prisma.config.ts exige DATABASE_URL definido pra não falhar ao carregar.
  DATABASE_URL: mysql://geekstore:geekstore@localhost:3306/geekstore

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
