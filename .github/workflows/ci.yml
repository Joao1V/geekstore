name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # prisma generate (packages/db) só lê o schema, não precisa de um banco real —
  # mas o prisma.config.ts exige DATABASE_URL definido pra não falhar ao carregar.
  DATABASE_URL: mysql://geekstore:geekstore@localhost:3306/geekstore
  # Só o teste de integração importa auth.service.ts, que exige essas vars via envConfig
  # (env.ts valida o schema inteiro) — valores fixos de CI, nunca usados fora daqui.
  JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000000
  COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else-0000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: geekstore
          MYSQL_USER: geekstore
          MYSQL_PASSWORD: geekstore
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply migrations
        run: pnpm --filter @geekstore/db exec prisma migrate deploy

      - name: Test (integration)
        run: pnpm --filter api test:integration

      - name: Build
        run: pnpm build
