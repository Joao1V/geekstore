name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # prisma generate (packages/db) só lê o schema, não precisa de um banco real —
  # mas o prisma.config.ts exige DATABASE_URL definido pra não falhar ao carregar.
  DATABASE_URL: postgresql://geekstore:geekstore@localhost:5432/geekstore
  # Só o teste de integração importa auth.service.ts, que exige essas vars via envConfig
  # (env.ts valida o schema inteiro) — valores fixos de CI, nunca usados fora daqui.
  JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000000
  COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else-0000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # Sem initdb customizado (locale ICU) de propósito: é o caso mais estrito, o mesmo de um
      # PostgreSQL criado pelo Dokploy. As migrações não podem depender de collation especial.
      postgres:
        image: postgres:18
        options: >-
          --health-cmd="pg_isready -U geekstore -d geekstore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        env:
          POSTGRES_USER: geekstore
          POSTGRES_PASSWORD: geekstore
          POSTGRES_DB: geekstore
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply migrations
        run: pnpm --filter @geekstore/db exec prisma migrate deploy

      - name: Test (integration)
        run: pnpm --filter api test:integration

      - name: Build
        run: pnpm build

  # Constrói as imagens no GitHub e publica no GHCR; o Dokploy só faz `pull`. Compilar no VPS
  # (5,8 GB de RAM, dividido com outros projetos) já o derrubou uma vez, então o deploy automático
  # por build local está desligado. Só roda na `main`, depois do CI verde.
  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: geekstore-api
            dockerfile: apps/api/Dockerfile
            target: runner
          - image: geekstore-migrator
            dockerfile: apps/api/Dockerfile
            target: migrator
          - image: geekstore-web-admin
            dockerfile: apps/web/Dockerfile
            app_mode: admin
          - image: geekstore-web-store
            dockerfile: apps/web/Dockerfile
            app_mode: store
    env:
      # Hostname interno do serviço da API na rede do Dokploy. O rewrite de /api/* do Next é
      # resolvido no build e gravado na imagem (ver apps/web/Dockerfile), então precisa estar aqui.
      API_INTERNAL_URL: http://app-generate-digital-bus-okhtk9:3333

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            APP_MODE=${{ matrix.app_mode || 'full' }}
            API_INTERNAL_URL=${{ env.API_INTERNAL_URL }}
          push: true
          # GHCR exige nome em minúsculas; o dono é Joao1V.
          tags: |
            ghcr.io/joao1v/${{ matrix.image }}:latest
            ghcr.io/joao1v/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
